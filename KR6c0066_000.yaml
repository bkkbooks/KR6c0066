front:
  text: 金剛經筆記序陳了翁嘗云佛法之要只金剛一卷足矣此經於一切有名有相有覺有見皆歸為虗妄即宣尼一以貫之之意也了翁于佛法不甚深入而晚年所見及此余少時即誦此經逢師請益一師曰莫看此經太纏復否余曰然師曰前半卷是酬應住降伏之詞後半卷乃答發阿耨菩提之旨非纏復也余唯唯既而憨山大師以決疑出示大意謂佛說法三十年上首猶是懷疑故此經隨空生所疑處即便逐破所謂疑悔永已盡安住實智中而其旨本于無著菩薩以二十七疑分經菩薩契佛心印憨師契菩薩心印當無剩義隨拜受而流通焉以余所聞此經不隨分演說且有合于一貫之義者其諦論止此今蘊虗觀公所著筆記不竪識解不畸宗派奧原衍乎前哲會萃昭乎片靈如撥沙逗金剖石窺玉無煩挈法與人而家珍躍如可獲茲固顯白坦露導發學人之正儀的也良繇觀公履踐真實貌癯趣淡道風肅然宿為緇素所傾慕是以詮釋所至行可標式著準不徒以詩偈垂譽則又余得之白法琮公所推讚不置者也噫嘻凡佛言語孰為世間思惟心所測順解一句頭上安頭逆解一句屋下架屋況此經為上上人悟空菩薩剖決疑根者哉云何具金剛眼云何得金剛心此在言語道斷時薦取觀公即泥水婆心恐不能含蜜說甜含甜說蜜另下一番注腳也時崇禎十年臘八前一日掃庵髯道人談貞默合十謹序金剛般若波羅蜜經筆記自序蓋聞般若如大火聚釋迦世尊從此大冶爐中煅煉幾番所以菩提場內正覺初成嘆云奇哉奇哉普見一切衆生皆有如來智慧德相但以妄想執著而不證得繇此觀之則聖凡一體之旨可知矣然我佛已悟衆生尚迷向水月場中多方設化如長風之吹萬竅空谷之答衆響良繇機感千差法門無量因指觀月猶隔纖雲洗凡聖之情塵純談般若斷我法之妄執取譬金剛空生以上求下化而興問端世尊約自利利他以通疑滯廣修六度無度可修普化四生無生可化菩提煩惱類鏡像之妍生死涅槃等空華之濃淡法身寂滅無而不無應化隨緣有而不有演說一偈布施河沙身命功不較多受持全經供養無量諸佛福不為廣一念淨信實相現前非實非虗超情離見則知著衣持鉢孰運神通趺坐游行憑誰道力一經要旨體用全彰雖八萬法門百千公案何以踰此哉然離言妙性不屬筌蹄訓詁繁辭猶為剩語前賢往哲注疏科文秋菊春蘭各擅其美觀游心講席蓋亦有年欲益將來聊陳管見緣茲像季樂簡憚繁撮先彥之玄微附鄙衷之陋見命曰筆記以質諸方然五百弟子各說身因佛許無非正說古語云見聞為種八難超十地之階解行在躬一生圓曠劫之果固有望於斯也知我罪我又何辭焉時崇禎歲次丁丑佛生日武原崇福菴沙門如觀撰
